workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # These variables are set in the Codemagic UI under "Environment variables"
      # (Team → Integrations → App Store Connect → add an API key)
      # Required vars: APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID,
      #                APP_STORE_CONNECT_PRIVATE_KEY (content of .p8 file, set as secret)
      groups:
        - appstore_credentials  # create this group in Codemagic with the 3 vars above
      vars:
        BUNDLE_ID: com.strawtop.strawtopRaceway
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white-part
          include: true

    scripts:
      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files (App Store Connect API)
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up signing certificate
        script: keychain add-certificates

      - name: Use provisioning profiles in Xcode project
        script: xcode-project use-profiles

      - name: Flutter pub get
        script: flutter pub get

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false   # set true to auto-submit to TestFlight
        submit_to_app_store: false
