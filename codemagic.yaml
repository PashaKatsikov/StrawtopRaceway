workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Group must exist in Codemagic UI → Environment variables, containing exactly:
      #   APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID,
      #   APP_STORE_CONNECT_PRIVATE_KEY (content of the .p8 file, marked as secure).
      # The API key needs at least App Manager access rights.
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.strawtop.strawtopRaceway
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: ios-white-part
          include: true

    scripts:
      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files (App Store Connect API)
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up signing certificate
        script: keychain add-certificates

      - name: Use provisioning profiles in Xcode project
        script: |
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --code-signing-setup-verbose-logging

      - name: Flutter pub get
        script: flutter pub get

      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false   # set true to auto-submit to TestFlight
        submit_to_app_store: false
